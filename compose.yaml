services:
  provider-fake:
    build: ./provider-fake
    env_file: .env
    ports:
      - "8090:8090"

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ./app
    # Sem env_file: a aplicação recebe só a chave do gateway, nunca as dos providers.
    environment:
      GATEWAY_API_KEY: ${GATEWAY_APP_KEY}
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      provider-fake:
        condition: service_healthy
      gateway:
        condition: service_healthy

  # AI Gateway: único caminho da aplicação até os providers (ADR 0002).
  gateway:
    image: ghcr.io/berriai/litellm:v1.102.1
    entrypoint: ["/gateway/entrypoint.sh"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:litellm@gateway-db:5432/litellm
    ports:
      - "4000:4000"
    volumes:
      - ./gateway:/gateway:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; assert os.path.exists('/tmp/provisioned'); urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      provider-fake:
        condition: service_healthy
      gateway-db:
        condition: service_healthy

  # Banco do gateway: chaves virtuais, orçamentos e gasto (ADR 0006).
  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30
